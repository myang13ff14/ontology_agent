<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ontology Agent Lab</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="window">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
        <button class="icon-button" id="sidebar-toggle" aria-label="Show or hide experiment controls" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M7.5 4v12"/></svg>
        </button>
      </div>
      <nav class="segmented" id="tabs" role="tablist" aria-label="Sections"></nav>
      <div class="toolbar-status" id="toolbar-status"></div>
    </header>
    <div class="body">
      <aside class="sidebar" id="sidebar" aria-label="Experiment controls"></aside>
      <main class="main" id="main"></main>
    </div>
  </div>
  <div class="tooltip" id="tooltip" hidden></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
