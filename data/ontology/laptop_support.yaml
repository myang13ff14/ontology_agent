- id: R_BIOS_POWER
  type: DecisionRule
  name: Firmware Update Power Requirement
  definition: A firmware update must not lose power part-way through.
  synonyms: []
  properties:
    expression: ac_connected == true and battery_percent >= 20
    category: safety
    failure_message: Connect the AC adapter and charge to at least 20% before updating firmware.
- id: R_OPEN_CHASSIS
  type: DecisionRule
  name: Internal Access Safety Requirement
  definition: Internal parts may only be handled with the device off and unplugged, by a capable customer.
  synonyms: []
  properties:
    expression: device_powered_off == true and ac_connected == false and customer_technical == true
    category: safety
    failure_message: Do not guide the customer inside the device unless it is off, unplugged and they are comfortable doing so.
- id: R_REMOVABLE_BATTERY
  type: DecisionRule
  name: Removable Battery Requirement
  definition: Only models with a customer-removable battery allow a battery reseat.
  synonyms: []
  properties:
    expression: removable_battery == true
    category: prerequisite
    failure_message: This model's battery is not customer-removable.
- id: R_NO_SWOLLEN_BATTERY
  type: DecisionRule
  name: Swollen Battery Prohibition
  definition: Never charge, discharge or stress a swollen battery.
  synonyms: []
  properties:
    expression: battery_swollen != true
    category: safety
    failure_message: 'Battery is swollen: stop, power down and arrange repair.'
- id: R_POWERED_OFF_CLEANING
  type: DecisionRule
  name: Power-Off Cleaning Requirement
  definition: Clean the keyboard only with the device powered off.
  synonyms: []
  properties:
    expression: device_powered_off == true
    category: safety
    failure_message: Power the device off before cleaning.
- id: R_ADMIN_RIGHTS
  type: DecisionRule
  name: Administrator Rights Requirement
  definition: Driver, firmware and network changes need administrator rights.
  synonyms: []
  properties:
    expression: has_admin_rights == true
    category: prerequisite
    failure_message: The customer needs administrator rights on the device.
- id: R_WARRANTY_REPAIR
  type: DecisionRule
  name: Repair Entitlement Policy
  definition: Depot repair needs warranty cover or agreement to pay.
  synonyms: []
  properties:
    expression: in_warranty == true or customer_accepts_paid_repair == true
    category: policy
    failure_message: 'Out of warranty: the customer must agree to a paid repair first.'
- id: R_CRU_ENTITLEMENT
  type: DecisionRule
  name: Part Shipment Entitlement Policy
  definition: Only customer-replaceable parts under warranty are shipped.
  synonyms: []
  properties:
    expression: in_warranty == true and part_is_customer_replaceable == true
    category: policy
    failure_message: Part shipment needs warranty cover and a customer-replaceable part.
- id: KA_1001
  type: KnowledgeArticle
  name: Checking Your AC Adapter
  definition: Match the wattage on the adapter label to the model; inspect the cable for kinks.
  synonyms:
  - KA-1001
  properties:
    status: current
    last_reviewed: '2025-06-10'
    summary: Match the wattage on the adapter label to the model; inspect the cable for kinks.
    url: https://kb.example.invalid/ka_1001
