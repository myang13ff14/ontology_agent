# SYNTHETIC DATA. Generated by `python -m ontolab.sample.laptop_support`; edit that script, not this file.
# Invented products, procedures, rules and articles for demonstration only.
ontology:
  name: laptop_support
  version: 1.0.0
  synthetic: true
  description: Synthetic ontology for IT customer service and laptop troubleshooting.
  source: ontolab.sample.laptop_support (synthetic)
object_types:
- name: Product
  description: A laptop product line.
  properties:
  - name: segment
    type: string
    description: Market segment.
- name: DeviceModel
  description: A specific laptop model within a product line.
  properties:
  - name: release_year
    type: number
    description: Year the model was released.
  - name: removable_battery
    type: boolean
    description: Whether the customer can remove the battery without tools.
  - name: charger_wattage
    type: number
    description: Wattage of the bundled AC adapter.
  - name: usb_c_charging
    type: boolean
    description: Whether the model charges over USB-C.
- name: Component
  description: A hardware or software part of a laptop, or a subsystem grouping parts.
  properties:
  - name: kind
    type: string
    description: hardware, software or subsystem.
  - name: customer_replaceable
    type: boolean
    description: Whether the part can be shipped for the customer to fit.
- name: Symptom
  description: A problem as experienced by the customer. Organised in a hierarchy.
  properties:
  - name: level
    type: string
    description: category for grouping symptoms, specific for reportable ones.
  - name: severity
    type: string
    description: low, medium, high or safety.
- name: CallDriver
  description: The business reason a customer contacts support; used for reporting.
  properties: []
- name: DiagnosticChecklist
  description: An ordered troubleshooting procedure for a symptom.
  properties:
  - name: owner
    type: string
    description: Team that maintains the checklist.
- name: DiagnosticAction
  description: A single reusable troubleshooting step.
  properties:
  - name: estimated_minutes
    type: number
    description: Typical time to perform the step.
  - name: risk
    type: string
    description: low, medium or high.
  - name: remote_capable
    type: boolean
    description: Whether the step can be done by the customer over the phone.
  - name: action_kind
    type: string
    description: check, fix, or disposition.
- name: ActionOutcome
  description: A possible result of performing a diagnostic action.
  properties:
  - name: code
    type: string
    description: Short outcome code, unique within the action.
  - name: resolution
    type: string
    description: resolved, continue, work_order or escalate.
- name: DecisionRule
  description: A business rule that decides whether an action may be performed.
  properties:
  - name: expression
    type: string
    description: Boolean expression over context facts.
  - name: category
    type: string
    description: safety, policy or prerequisite.
  - name: failure_message
    type: string
    description: What to tell the agent when the rule is not satisfied.
- name: KnowledgeArticle
  description: A support article describing how to perform actions.
  properties:
  - name: status
    type: string
    description: current, outdated or superseded.
  - name: last_reviewed
    type: string
    description: ISO date of the last editorial review.
  - name: summary
    type: string
    description: Key guidance in the article.
  - name: url
    type: string
    description: Synthetic link.
- name: ServiceCase
  description: A customer contact handled by support.
  storage: operational
  table: service_case
  key_column: case_id
- name: WorkOrder
  description: A repair or part shipment raised from a case.
  storage: operational
  table: work_order
  key_column: work_order_id
- name: DiagnosticExecution
  description: One diagnostic action performed during a case.
  storage: operational
  table: diagnostic_execution
  key_column: execution_id
relationship_types:
- name: HAS_MODEL
  description: A product line includes a device model.
  source_types:
  - Product
  target_types:
  - DeviceModel
  hierarchical: false
  properties: []
- name: HAS_COMPONENT
  description: A product contains a component.
  source_types:
  - Product
  target_types:
  - Component
  hierarchical: false
  properties: []
- name: PART_OF
  description: A component belongs to a subsystem.
  source_types:
  - Component
  target_types:
  - Component
  hierarchical: true
  properties: []
- name: SUBTYPE_OF
  description: A symptom is a more specific kind of another symptom.
  source_types:
  - Symptom
  target_types:
  - Symptom
  hierarchical: true
  properties: []
- name: INDICATES
  description: A symptom points to a component as a possible cause.
  source_types:
  - Symptom
  target_types:
  - Component
  hierarchical: false
  properties:
  - name: likelihood
    type: number
    description: Share of cases with this symptom traced to the component.
- name: HAS_CALL_DRIVER
  description: A symptom is reported under a call driver.
  source_types:
  - Symptom
  target_types:
  - CallDriver
  hierarchical: false
  properties: []
- name: HAS_CHECKLIST
  description: A symptom is troubleshot with a checklist. Inherited by subtypes that have none.
  source_types:
  - Symptom
  target_types:
  - DiagnosticChecklist
  hierarchical: false
  properties: []
- name: CONTAINS
  description: A checklist contains an action at a step position.
  source_types:
  - DiagnosticChecklist
  target_types:
  - DiagnosticAction
  hierarchical: false
  properties:
  - name: step_order
    type: number
    description: Position of the action in the checklist.
- name: HAS_OUTCOME
  description: An action can end in an outcome.
  source_types:
  - DiagnosticAction
  target_types:
  - ActionOutcome
  hierarchical: false
  properties: []
- name: LEADS_TO
  description: After an outcome, the next action to perform. May be conditional.
  source_types:
  - ActionOutcome
  target_types:
  - DiagnosticAction
  hierarchical: false
  properties:
  - name: condition
    type: string
    description: Expression over context (e.g. checklist_id) that must hold for this branch.
- name: GOVERNED_BY
  description: An action may only be performed when a decision rule is satisfied.
  source_types:
  - DiagnosticAction
  target_types:
  - DecisionRule
  hierarchical: false
  properties: []
- name: DESCRIBES
  description: A knowledge article explains how to perform an action.
  source_types:
  - KnowledgeArticle
  target_types:
  - DiagnosticAction
  hierarchical: false
  properties: []
- name: SUPERSEDES
  description: A knowledge article replaces an older one.
  source_types:
  - KnowledgeArticle
  target_types:
  - KnowledgeArticle
  hierarchical: false
  properties: []
- name: HAS_SYMPTOM
  description: A service case was opened for a symptom.
  source_types:
  - ServiceCase
  target_types:
  - Symptom
  storage: operational
  table: service_case
  source_column: case_id
  target_column: symptom_id
- name: FOR_MODEL
  description: A service case concerns a device model.
  source_types:
  - ServiceCase
  target_types:
  - DeviceModel
  storage: operational
  table: service_case
  source_column: case_id
  target_column: device_model_id
- name: HAS_DRIVER
  description: A service case is classified under a call driver.
  source_types:
  - ServiceCase
  target_types:
  - CallDriver
  storage: operational
  table: service_case
  source_column: case_id
  target_column: call_driver_id
- name: GENERATES
  description: A service case produced a work order.
  source_types:
  - ServiceCase
  target_types:
  - WorkOrder
  storage: operational
  table: work_order
  source_column: case_id
  target_column: work_order_id
- name: EXECUTED
  description: A service case included a diagnostic execution.
  source_types:
  - ServiceCase
  target_types:
  - DiagnosticExecution
  storage: operational
  table: diagnostic_execution
  source_column: case_id
  target_column: execution_id
- name: PERFORMED_ACTION
  description: A diagnostic execution performed an action.
  source_types:
  - DiagnosticExecution
  target_types:
  - DiagnosticAction
  storage: operational
  table: diagnostic_execution
  source_column: execution_id
  target_column: action_id
- name: REPLACES_COMPONENT
  description: A work order replaces a component.
  source_types:
  - WorkOrder
  target_types:
  - Component
  storage: operational
  table: work_order
  source_column: work_order_id
  target_column: component_id
profile_recipes:
  Symptom:
  - - HAS_CHECKLIST
  - - HAS_CHECKLIST
    - CONTAINS
  - - HAS_CHECKLIST
    - CONTAINS
    - GOVERNED_BY
  - - HAS_CHECKLIST
    - CONTAINS
    - ~DESCRIBES
  DiagnosticChecklist:
  - - CONTAINS
  - - CONTAINS
    - HAS_OUTCOME
    - LEADS_TO
  - - CONTAINS
    - GOVERNED_BY
  DiagnosticAction:
  - - HAS_OUTCOME
    - LEADS_TO
  - - ~CONTAINS
    - ~HAS_CHECKLIST
  Component:
  - - ~INDICATES
    - HAS_CALL_DRIVER
  CallDriver:
  - - ~HAS_CALL_DRIVER
    - INDICATES
  DecisionRule:
  - - ~GOVERNED_BY
    - ~CONTAINS
