  - {id: CR_001_1, type: CheckResult, name: "Case 001 check 1: power indicator light", properties: {result: lit, evidence: "Customer: the light is on, it's white.", executed_at: "2026-03-02T09:13:00"}}
  - {id: CR_001_2, type: CheckResult, name: "Case 001 check 2: screen surface inspection", properties: {result: intact, evidence: "Customer: no cracks, and I don't see any dark patches.", executed_at: "2026-03-02T09:16:00"}}
  - {id: AS_001_2, type: SymptomAssessment, name: Case 001 assessment 2, definition: "Narrowed: only Black Screen is left.",
