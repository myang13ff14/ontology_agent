  - {id: CR_001_3, type: CheckResult, name: "Case 001 check 3: external monitor test", properties: {result: external_ok, evidence: "Customer: it shows a picture on my TV.", executed_at: "2026-03-02T09:24:00"}}
  - {id: AS_001_3, type: SymptomAssessment, name: Case 001 assessment 3, definition: "Confirmed: Black Screen, with the fault on the built-in display side.",
