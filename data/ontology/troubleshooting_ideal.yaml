  - {id: CR_001_3, type: CheckResult, name: "Case 001 check 3: external monitor test", properties: {result: external_ok, evidence: "Customer: it shows a picture on my TV.", executed_at: "2026-03-02T09:24:00"}}
  - {id: AS_001_3, type: SymptomAssessment, name: Case 001 assessment 3, definition: "Confirmed: Black Screen, with the fault on the built-in display side.",
     properties: {sequence: 3, status: confirmed, evidence: "Both distinguishing conditions of Black Screen are met; the external screen works, so the laptop and its graphics are fine.", assessed_at: "2026-03-02T09:25:00"}}

  # ---- case 2: clear description -> one check confirms the symptom, the checklist locates the cause ----
  - {id: CASE_002, type: SupportCase, name: "Case 002: plugged in, not charging", definition: "A clear description, confirmed as Not Charging with one check.",
     properties: {raw_description: "The charger is plugged in and it says plugged in, but the battery has been stuck at 40% and won't go up", status: resolved, channel: chat, opened_at: "2026-03-03T14:02:00", closed_at: "2026-03-03T14:15:00"}}
  - {id: AS_002_1, type: SymptomAssessment, name: Case 002 assessment 1, definition: "Initial judgement: the description matches a typical expression of Not Charging.",
     properties: {sequence: 1, status: superseded, evidence: "The description closely matches a typical expression of Not Charging; to be confirmed by a check.", assessed_at: "2026-03-03T14:03:00"}}
  - {id: CR_002_1, type: CheckResult, name: "Case 002 check 1: charging status", properties: {result: plugged_not_charging, evidence: "Customer screenshot: the battery icon reads plugged in, not charging.", executed_at: "2026-03-03T14:05:00"}}
  - {id: AS_002_2, type: SymptomAssessment, name: Case 002 assessment 2, definition: "Confirmed: Not Charging.",
     properties: {sequence: 2, status: confirmed, evidence: "Charging status is plugged in, not charging, which meets the distinguishing condition of Not Charging.", assessed_at: "2026-03-03T14:06:00"}}
  - {id: CR_002_2, type: CheckResult, name: "Case 002 check 2: adapter indicator light", properties: {result: lit, evidence: "Customer: the light on the charger is on.", executed_at: "2026-03-03T14:07:00"}}
  - {id: CR_002_3, type: CheckResult, name: "Case 002 check 3: spare adapter test", properties: {result: charges, evidence: "Customer: it started charging as soon as I used my colleague's charger.", executed_at: "2026-03-03T14:11:00"}}

  # ---- case 3: first judgement wrong -> overturned by a check result -> revised ----
  - {id: CASE_003, type: SupportCase, name: "Case 003: battery problem", definition: "First judged as Not Charging, then revised to Short Battery Life when a check result contradicted it.",
     properties: {raw_description: "There's a problem with my battery, it keeps running out of power", status: resolved, channel: phone, opened_at: "2026-03-05T10:20:00", closed_at: "2026-03-05T10:44:00"}}
  - {id: AS_003_1, type: SymptomAssessment, name: Case 003 assessment 1, definition: "Initial judgement: two candidates, leaning towards Not Charging.",
     properties: {sequence: 1, status: superseded, evidence: "A problem with my battery is a vague expression of both Not Charging and Short Battery Life; keeps running out of power leans slightly towards Not Charging.", assessed_at: "2026-03-05T10:21:00"}}
  - {id: CR_003_1, type: CheckResult, name: "Case 003 check 1: charging status", properties: {result: charging, evidence: "Customer: it says charging, and after a while it gets to 100%.", executed_at: "2026-03-05T10:25:00"}}
  - {id: CR_003_2, type: CheckResult, name: "Case 003 check 2: runtime on a full charge", properties: {result: short, evidence: "Customer: after a full charge it lasts about forty minutes.", executed_at: "2026-03-05T10:27:00"}}
  - {id: AS_003_2, type: SymptomAssessment, name: Case 003 assessment 2, definition: "Revised: Short Battery Life. The earlier lean towards Not Charging is ruled out.",
     properties: {sequence: 2, status: confirmed, evidence: "It charges normally, which rules out Not Charging; under 2 hours on a full charge meets every distinguishing condition of Short Battery Life.", assessed_at: "2026-03-05T10:28:00"}}
  - {id: CR_003_3, type: CheckResult, name: "Case 003 check 3: battery health reading", properties: {result: degraded, evidence: "Customer reads from the battery report: health 61%.", executed_at: "2026-03-05T10:35:00"}}

